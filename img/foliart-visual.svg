<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title description"><title id="title">FoliaRT: neural model of canopy scattering</title><desc id="description">Conceptual illustration showing an incoming radio signal and its scattering through a tree canopy.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e3342"/><stop offset="1" stop-color="#0b1a31"/></linearGradient></defs><rect width="1000" height="600" rx="28" fill="url(#bg)"/><text x="58" y="70" fill="#95e5c1" font-family="Arial" font-size="22" font-weight="700" letter-spacing="3">PHYSICS-INFORMED PROPAGATION</text><text x="58" y="121" fill="#fff" font-family="Arial" font-size="40" font-weight="700">Learning how canopies scatter radio waves</text><text x="58" y="161" fill="#bcd8de" font-family="Arial" font-size="21">A reusable surrogate for vegetation in site-specific ray tracing</text><path d="M505 482V320" stroke="#8b7058" stroke-width="28" stroke-linecap="round"/><path d="M502 363L424 294M510 378L595 290" stroke="#866849" stroke-width="15"/><g fill="#2f9e86"><circle cx="405" cy="284" r="78"/><circle cx="506" cy="251" r="91"/><circle cx="603" cy="296" r="81"/><circle cx="460" cy="327" r="77"/><circle cx="548" cy="329" r="80"/></g><g fill="#7cd3a1" opacity=".65"><circle cx="437" cy="237" r="47"/><circle cx="554" cy="225" r="48"/><circle cx="593" cy="303" r="49"/></g><path d="M92 354L375 317" stroke="#e5f49d" stroke-width="7"/><path d="M359 305l22 10-20 18" fill="none" stroke="#e5f49d" stroke-width="6"/><g stroke="#91e6d1" stroke-width="5" fill="none"><path d="M600 286L845 219"/><path d="M610 319L869 320"/><path d="M593 360L826 438"/></g><g fill="#91e6d1"><path d="M829 207l26 9-18 19"/><path d="M851 307l25 13-25 13"/><path d="M812 425l20 22-25 3"/></g><g font-family="Arial"><rect x="84" y="380" width="238" height="60" rx="13" fill="#133b4a" stroke="#84cbb0"/><text x="102" y="406" fill="#fff" font-size="19" font-weight="700"